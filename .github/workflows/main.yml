name: Compress Termi-Script IDE to Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Opt into the new runner engine to clear out the warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK v21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Cleanly updates to the new recommended default node release

      - name: Install Project Dependencies and Stage Assets
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          
          cp [iI]ndex.html* www/index.html 2>/dev/null || true
          cp [rR]enderer.js* www/renderer.js 2>/dev/null || true
          cp [mM]ain.js* www/main.js 2>/dev/null || true
          
          if [ ! -f www/index.html ]; then
            echo '<!DOCTYPE html><html><head><title>Termi-Script IDE</title></head><body style="background:#1e1e1e;color:white;"><h1>Termi-Script Studio Mobile v1.0</h1></body></html>' > www/index.html
          fi
          
          npx cap init "Termi Script Studio" "com.termiscript.ide" --web-dir=www

      - name: Scaffold Native Android Assets Wrapper
        run: |
          npx cap add android
          npx cap sync android

      - name: Compile and Compress Assets to APK
        run: |
          cd android
          chmod +x ./gradlew
          
          # Force the Android compilation sub-properties to use Java 21 variables directly
          ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME_21_X64

      - name: Upload Compressed Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Termi-Script-IDE-Android-v1.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
