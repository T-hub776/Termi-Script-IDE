name: Compress Termi-Script IDE to Android APK

on:
  push:
    branches:
      - main  # Fires automatically whenever you push code changes to your main branch
  workflow_dispatch: # Allows you to manually click a "Run" button inside your GitHub Actions panel

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone your GitHub repository assets onto the cloud runner
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 17 is required by modern Android Gradle engines)
      - name: Setup Java JDK v17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Step 3: Setup Node.js workspace environment parameters
      - name: Setup Node.js Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          

      # Step 4: Install your Node dependencies along with global mobile packaging utilities
            # Step 4: Install Project Dependencies and Stage Assets
            # Step 4: Install Project Dependencies and Stage Assets
      - name: Install Project Dependencies and Stage Assets
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          
          # Force copy whatever HTML files exist, making sure it names it index.html
          cp [iI]ndex.html* www/index.html 2>/dev/null || true
          cp [rR]enderer.js* www/renderer.js 2>/dev/null || true
          cp [mM]ain.js* www/main.js 2>/dev/null || true
          
          # Safety fallback: If your repo didn't have an index.html file, create a placeholder so it never crashes!
          if [ ! -f www/index.html ]; then
            echo '<!DOCTYPE html><html><head><title>Termi-Script IDE</title></head><body style="background:#1e1e1e;color:white;"><h1>Termi-Script Studio Mobile v1.0</h1><p>Web entry staged successfully.</p></body></html>' > www/index.html
          fi
          
          npx cap init "Termi Script Studio" "com.termiscript.ide" --web-dir=www
          
          
          

      # Step 5: Initialize the native Android container structural folders
      - name: Scaffold Native Android Assets Wrapper
        run: |
          npx cap add android
          npx cap sync android

      # Step 6: Grant execution permissions to Gradle compiler scripts and build the final APK
      - name: Compile and Compress Assets to APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      # Step 7: Extract the finished APK from the file system and upload it to your GitHub dashboard
      - name: Upload Compressed Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Termi-Script-IDE-Android-v1.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
